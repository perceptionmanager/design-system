name: tokens
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Validates structure, references, tier direction and WCAG contrast,
      # then fails if dist/ is out of date with tokens/.
      - run: npm run check
